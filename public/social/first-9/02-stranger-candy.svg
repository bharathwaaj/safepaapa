<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" role="img">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#042f2e"/>
      <stop offset="0.62" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#042f2e" stop-opacity="0.08"/>
      <stop offset="0.62" stop-color="#042f2e" stop-opacity="0.56"/>
      <stop offset="1" stop-color="#042f2e" stop-opacity="0.96"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#022c22" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>
  <image href="../../images/situation-stranger-candy.jpg" x="86" y="116" width="908" height="514" preserveAspectRatio="xMidYMid slice" opacity="0.96"/>
  <rect x="86" y="116" width="908" height="514" rx="46" fill="url(#fade)"/>
  <rect x="86" y="116" width="908" height="514" rx="46" fill="none" stroke="#ccfbf1" stroke-opacity="0.28" stroke-width="2"/>

  <g transform="translate(540 638)" filter="url(#shadow)">
    <circle cx="0" cy="-492" r="58" fill="#ecfeff" opacity="0.96"/>
    <image href="../../logo.svg" x="-64" y="-531" width="128" height="77" preserveAspectRatio="xMidYMid meet"/>
  </g>

  <g>
    <text x="540" y="710" fill="#ffffff" font-family="Arial Unicode MS, Kohinoor Tamil, sans-serif" font-size="64" font-weight="800" text-anchor="middle">அந்நியர் இனிப்பு</text>
<text x="540" y="788" fill="#ffffff" font-family="Arial Unicode MS, Kohinoor Tamil, sans-serif" font-size="64" font-weight="800" text-anchor="middle">கொடுத்தால்?</text>
  </g>

  <g>
    <text x="540" y="860" fill="#ccfbf1" font-family="Arial Unicode MS, Kohinoor Tamil, sans-serif" font-size="36" font-weight="700" text-anchor="middle">“அம்மாவிடம் கேட்டுவிட்டு</text>
<text x="540" y="908" fill="#ccfbf1" font-family="Arial Unicode MS, Kohinoor Tamil, sans-serif" font-size="36" font-weight="700" text-anchor="middle">தான் வாங்குவேன்.”</text>
  </g>

