<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" role="img" aria-labelledby="title desc">
  <title id="title">SafePaapa intro Instagram post</title>
  <desc id="desc">SafePaapa intro post with Tamil child safety message.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#042f2e"/>
      <stop offset="0.54" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="35%" r="64%">
      <stop offset="0" stop-color="#ccfbf1" stop-opacity="0.2"/>
      <stop offset="0.55" stop-color="#99f6e4" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#042f2e" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#022c22" flood-opacity="0.26"/>
    </filter>
  </defs>

  <rect width="1080" height="1080" fill="url(#bg)"/>
  <rect width="1080" height="1080" fill="url(#glow)"/>

  <g opacity="0.14" fill="none" stroke="#ffffff" stroke-width="2">
    <circle cx="92" cy="126" r="112"/>
    <circle cx="1018" cy="914" r="156"/>
    <path d="M120 862 C252 742 342 906 482 790 S752 710 946 812"/>
  </g>

  <g transform="translate(540 130)" text-anchor="middle">
    <text x="0" y="0" fill="#ffffff" font-family="Nunito, Arial, sans-serif" font-size="54" font-weight="800">SafePaapa</text>
    <text x="0" y="42" fill="#ccfbf1" font-family="Arial Unicode MS, Kohinoor Tamil, sans-serif" font-size="24" font-weight="700">தமிழ்நாடு குழந்தை பாதுகாப்பு</text>
  </g>

  <g transform="translate(540 344)" filter="url(#softShadow)">
    <circle cx="0" cy="0" r="126" fill="#ecfeff" opacity="0.96"/>
    <image href="../logo.svg" x="-138" y="-83" width="276" height="166" preserveAspectRatio="xMidYMid meet"/>
  </g>

  <g text-anchor="middle">
    <text x="540" y="570" fill="#ffffff" font-family="Arial Unicode MS, Kohinoor Tamil, sans-serif" font-size="72" font-weight="700">குழந்தைகளை</text>
    <text x="540" y="660" fill="#ffffff" font-family="Arial Unicode MS, Kohinoor Tamil, sans-serif" font-size="72" font-weight="700">பாதுகாப்போம்</text>

    <text x="540" y="734" fill="#fffbeb" font-family="Arial Unicode MS, Kohinoor Tamil, sans-serif" font-size="30" font-weight="700">பெற்றோர் • ஆசிரியர்கள் • குடும்பங்கள்</text>
    <text x="540" y="804" fill="#ccfbf1" font-family="Arial Unicode MS, Kohinoor Tamil, sans-serif" font-size="34" font-weight="700">ஒரு நிமிட உரையாடல்</text>
    <text x="540" y="852" fill="#ccfbf1" font-family="Arial Unicode MS, Kohinoor Tamil, sans-serif" font-size="34" font-weight="700">ஒரு குழந்தையை பாதுகாக்கலாம்.</text>
  </g>

  <g transform="translate(120 932)">
    <rect x="0" y="0" width="840" height="82" rx="41" fill="#042f2e" opacity="0.8"/>
    <text x="54" y="53" fill="#fda4af" font-family="Nunito, Arial, sans-serif" font-size="26" font-weight="800">CHILDLINE 1098</text>
    <text x="420" y="53" fill="#ffffff" font-family="Nunito, Arial, sans-serif" font-size="26" font-weight="800" text-anchor="middle">safepaapa.in</text>
    <text x="786" y="53" fill="#99f6e4" font-family="Nunito, Arial, sans-serif" font-size="26" font-weight="800" text-anchor="end">@safepaapa</text>
  </g>
</svg>
